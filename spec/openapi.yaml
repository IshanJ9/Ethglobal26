openapi: 3.1.0
info:
  title: Proofwork API
  version: 1.6.0
  description: |
    FROZEN CONTRACT between Agent A (implements) and Agent B (consumes). Changes only via CHANGE_REQUESTS.md.
    Conventions (apply everywhere):
    - Money = decimal STRING of base units (USDC has 6 decimals; 1 USDC = "1000000"). Never JSON numbers, never floats.
    - Scores: score_ppm (parts per million), *_bps (basis points), milli-points. All JSON INTEGERS.
    - Hashes/commitments = lowercase 0x + 64 hex. Addresses = EIP-55 checksummed. Signatures = 0x + 130 hex.
    - Timestamps = RFC 3339 UTC. Dates = YYYY-MM-DD.
    - All IDs are opaque strings with a type prefix (emp_, cyc_, pln_, clm_, evd_, run_, scd_, apr_, bat_, att_).
    - Errors always use the Error schema. Unknown request fields are rejected (400 unknown_field).
    - Idempotency: POST endpoints that create things accept optional header Idempotency-Key.
servers:
  - url: http://localhost:8787
    description: local dev (API port fixed at 8787)
tags:
  - { name: meta }
  - { name: auth }
  - { name: org }
  - { name: claims }
  - { name: cosign }
  - { name: evidence }
  - { name: scores }
  - { name: approvals }
  - { name: chain }
  - { name: payouts }
  - { name: verify }
  - { name: review }
  - { name: zk }
  - { name: agent-pass }
  - { name: dev }
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, spec_version]
                properties:
                  ok: { type: boolean }
                  spec_version: { type: string }
  /v1/config/public:
    get:
      tags: [meta]
      operationId: getPublicConfig
      security: []
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/PublicConfig" } } } }
  /v1/dev/login:
    post:
      tags: [auth]
      operationId: devLogin
      security: []
      description: Demo login as a seeded persona. Disabled when AUTH_MODE != dev. Returns an HS256 JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [persona_id]
              properties:
                persona_id: { $ref: "#/components/schemas/PersonaId" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, persona]
                properties:
                  token: { type: string }
                  persona: { $ref: "#/components/schemas/Persona" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Persona" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/org/employees:
    get:
      tags: [org]
      operationId: listEmployees
      description: ABAC-filtered. Employees see only themselves; managers see their reports; HR sees all.
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Employee" } } } } } } }
  /v1/org/plans:
    get:
      tags: [org]
      operationId: listPlans
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } } }
  /v1/org/plans/{plan_id}:
    get:
      tags: [org]
      operationId: getPlan
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/cycles:
    get:
      tags: [org]
      operationId: listCycles
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Cycle" } } } } } } }
  /v1/claims:
    post:
      tags: [claims]
      operationId: createClaim
      description: |
        Employee submits free text ("I did X"). The AI draft step (0G Private Computer, or mock) turns it into a structured
        ClaimBody + evidence excerpt. State = drafted. Nothing is signed or anchored yet.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimCreate" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [claims]
      operationId: listClaims
      parameters:
        - { name: cycle_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ClaimState" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Claim" } } } } } } }
  /v1/claims/{claim_id}:
    get:
      tags: [claims]
      operationId: getClaim
      parameters: [{ $ref: "#/components/parameters/ClaimId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/claims/{claim_id}/draft:
    patch:
      tags: [claims]
      operationId: editClaimDraft
      description: Employee edits the AI draft. Only valid in state drafted. Recomputes nothing on-chain.
      parameters: [{ $ref: "#/components/parameters/ClaimId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: { $ref: "#/components/schemas/ClaimBody" }
                evidence_excerpt: { type: string, maxLength: 2000 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/claims/{claim_id}/signing-package:
    get:
      tags: [claims]
      operationId: getClaimSigningPackage
      description: |
        Returns the exact EIP-712 typed data the employee must sign, plus the values/salts so the UI can recompute the
        commitments locally with @proofwork/crypto (the "verify it yourself" panel). Freezes the draft.
      parameters: [{ $ref: "#/components/parameters/ClaimId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/SigningPackage" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/claims/{claim_id}/submit:
    post:
      tags: [claims]
      operationId: submitClaim
      description: Employee submits their EIP-712 signature. Backend recovers the signer and requires it equals the employee address. State -> pending_cosign.
      parameters: [{ $ref: "#/components/parameters/ClaimId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_signature]
              properties:
                employee_signature: { $ref: "#/components/schemas/Signature" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/claims/{claim_id}/cosign-grants:
    post:
      tags: [claims]
      operationId: createCosignGrant
      description: Creates a time-boxed, single-claim view grant for the co-signer. The token is returned ONCE (magic link). In dev mode the link is returned in the response and not emailed.
      parameters: [{ $ref: "#/components/parameters/ClaimId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auth_method]
              properties:
                auth_method: { $ref: "#/components/schemas/CosignAuthMethod" }
                ttl_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/CosignGrant" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/cosign/view:
    get:
      tags: [cosign]
      operationId: cosignView
      security: [{ cosignToken: [] }]
      description: Co-signer reads the claim they are asked to attest. After sign/decline/expiry/revocation this returns 410 grant_closed - the co-signer loses access.
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/CosignView" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/cosign/sign:
    post:
      tags: [cosign]
      operationId: cosignSign
      security: [{ cosignToken: [] }]
      description: |
        Co-signer submits the EIP-712 signature over the SAME typed data. If grant.auth_method is world_id then world_result is
        REQUIRED and validated server-side by the WorldVerifier adapter. Signature recovery must equal claim.cosigner address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature]
              properties:
                signature: { $ref: "#/components/schemas/Signature" }
                world_result: { $ref: "#/components/schemas/WorldResult" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/cosign/decline:
    post:
      tags: [cosign]
      operationId: cosignDecline
      security: [{ cosignToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "410": { $ref: "#/components/responses/Error" }
  /v1/runs:
    post:
      tags: [evidence]
      operationId: createRun
      description: "Starts the evidence-collection AGENT for an employee+cycle (tools: git, tickets, CRM, HRIS connectors; daily work-log). Returns immediately; poll GET /v1/runs/{id}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, cycle_id]
              properties:
                employee_id: { type: string }
                cycle_id: { type: string }
      responses:
        "202": { description: accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /v1/runs/{run_id}:
    get:
      tags: [evidence]
      operationId: getRun
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/evidence:
    get:
      tags: [evidence]
      operationId: listEvidence
      parameters:
        - { name: employee_id, in: query, schema: { type: string } }
        - { name: cycle_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EvidenceStatus" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/EvidenceItem" } } } } } } }
  /v1/evidence/{evidence_id}:
    get:
      tags: [evidence]
      operationId: getEvidence
      parameters: [{ $ref: "#/components/parameters/EvidenceId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/evidence/ingest:
    post:
      tags: [evidence]
      operationId: ingestEvidence
      security: [{ connectorKey: [] }]
      description: Connector webhook (e.g. GitHub/Jira/CRM adapters or the Zoho plugin). Evidence enters as unverified until a verification rule or co-sign promotes it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceIngest" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceItem" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/evidence/{evidence_id}/shred:
    post:
      tags: [evidence]
      operationId: shredEvidence
      description: HR/DPO erasure request. Destroys the per-record data key and deletes plaintext + 0G replica pointer. Commitment/Merkle leaf remain (non-reversible). Requires role hr.
      parameters: [{ $ref: "#/components/parameters/EvidenceId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceItem" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/dev/inject:
    post:
      tags: [dev]
      operationId: devInject
      description: Demo only (disabled when AUTH_MODE != dev). Plays a named step from spec/fixtures/seed-scenario.json into the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [step_id]
              properties:
                step_id: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [step_id, evidence_ids]
                properties:
                  step_id: { type: string }
                  evidence_ids: { type: array, items: { type: string } }
  /v1/scores/compute:
    post:
      tags: [scores]
      operationId: computeScore
      description: PURE and DETERMINISTIC. Same inputs -> byte-identical output. Never calls an LLM. Does not persist anything.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComputeRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ComputeResult" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/scorecards:
    post:
      tags: [scores]
      operationId: createScorecard
      description: Computes and persists the next version (v1, v2, ...) for an employee+cycle. If an attested version exists, the new version supersedes it (status draft until approved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, cycle_id]
              properties:
                employee_id: { type: string }
                cycle_id: { type: string }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Scorecard" } } } }
    get:
      tags: [scores]
      operationId: listScorecards
      parameters:
        - { name: employee_id, in: query, schema: { type: string } }
        - { name: cycle_id, in: query, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Scorecard" } } } } } } }
  /v1/scorecards/{scorecard_id}:
    get:
      tags: [scores]
      operationId: getScorecard
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Scorecard" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/scorecards/{scorecard_id}/diff/{other_id}:
    get:
      tags: [scores]
      operationId: diffScorecards
      parameters:
        - { $ref: "#/components/parameters/ScorecardId" }
        - { name: other_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ScorecardDiff" } } } }
  /v1/scorecards/{scorecard_id}/revise:
    post:
      tags: [scores]
      operationId: reviseScorecard
      description: Starts a revision because evidence changed (e.g. PR reverted). Creates the next version in status draft with reason. Equivalent to POST /v1/scorecards plus a recorded reason.
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Scorecard" } } } }
  /v1/approvals:
    post:
      tags: [approvals]
      operationId: createApproval
      description: Creates a human-approval request for a scorecard (manager). Returns the challenge the World step-up must bind to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scorecard_id]
              properties:
                scorecard_id: { type: string }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
  /v1/approvals/{approval_id}:
    get:
      tags: [approvals]
      operationId: getApproval
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
  /v1/approvals/{approval_id}/complete:
    post:
      tags: [approvals]
      operationId: completeApproval
      description: |
        Manager decision. approve requires a valid world_result (validated server-side). deny is final for this scorecard version:
        attestation and payout stay BLOCKED (409 approval_required). The approving user must hold role manager|hr for the employee and must not be the employee.
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                comment: { type: string, maxLength: 500 }
                world_result: { $ref: "#/components/schemas/WorldResult" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/approvals/{approval_id}/cancel:
    post:
      tags: [approvals]
      operationId: cancelApproval
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
  /v1/chain/anchor:
    post:
      tags: [chain]
      operationId: anchorBatch
      description: Builds a Merkle tree over all not-yet-anchored evidence commitments and calls registry.anchorBatch. Backend is the only tx sender.
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/AnchorBatch" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/chain/batches/{batch_id}:
    get:
      tags: [chain]
      operationId: getBatch
      parameters: [{ name: batch_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AnchorBatch" } } } }
  /v1/chain/attest:
    post:
      tags: [chain]
      operationId: attestScorecard
      description: Calls registry.attestScore for an APPROVED scorecard. 409 approval_required if the approval is missing/denied. Supersedes the previous attestation automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scorecard_id]
              properties:
                scorecard_id: { type: string }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/AttestationRef" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payouts/{scorecard_id}:
    get:
      tags: [payouts]
      operationId: getPayout
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Payout" } } } }
  /v1/payouts/{scorecard_id}/release:
    post:
      tags: [payouts]
      operationId: releasePayout
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Payout" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payouts/{scorecard_id}/release-holdback:
    post:
      tags: [payouts]
      operationId: releaseHoldback
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Payout" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/payouts/{scorecard_id}/dispute:
    post:
      tags: [payouts]
      operationId: disputePayout
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Payout" } } } }
  /v1/payouts/{scorecard_id}/resolve:
    post:
      tags: [payouts]
      operationId: resolveDispute
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [release_funds], properties: { release_funds: { type: boolean } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Payout" } } } }
  /v1/verify:
    post:
      tags: [verify]
      operationId: verify
      security: []
      description: |
        Public selective-disclosure verification. Caller supplies what they were shown (value + salt). Server recomputes the
        commitment, checks the Merkle proof against the anchored root read from chain, and (for claims) recovers both EIP-712 signers.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerifyRequest" } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyResult" } } } }
  /v1/audit:
    get:
      tags: [verify]
      operationId: listAudit
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
  /v1/clusters:
    get:
      tags: [review]
      operationId: listClusters
      description: "Peer clusters (department x level). Each cluster has its own KRA plan; people are only ever compared inside their cluster."
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Cluster" } }
  /v1/clusters/{cluster_id}/board:
    get:
      tags: [review]
      operationId: getClusterBoard
      description: "Layer 1 inside one cluster: every member's deterministic score, rank, percentile, z-score and per-KRA distribution. HR and managers of a member see names; an employee sees only their own row and anonymised peers."
      parameters:
        - { name: cluster_id, in: path, required: true, schema: { type: string } }
        - { name: cycle_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ClusterBoard" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/employees/{employee_id}/context:
    get:
      tags: [review]
      operationId: getEmployeeContext
      description: "Layer 2: history (past review periods), deadline record, target hit rate, trend and position in the cluster. Computed by code from committed evidence; no AI."
      parameters:
        - { name: employee_id, in: path, required: true, schema: { type: string } }
        - { name: cycle_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ContextReport" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reviews:
    post:
      tags: [review]
      operationId: createReview
      description: "Layer 3: builds the review packet from the encrypted evidence vault (0G Storage replica -> decrypt -> commitment re-checked), asks 0G Private Computer for HR-ready reasoning, rejects any number that is not in the packet, and stores the hashes. Optional peer must be in the same cluster (409 cluster_mismatch)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, cycle_id]
              properties:
                agent_pass_checkpoint_id: { type: [string, "null"], description: "Approved World ID Agent Pass checkpoint for exactly this operation (required when agent_pass_mode is live)." }
                employee_id: { type: string }
                cycle_id: { type: string }
                peer_employee_id: { type: [string, "null"] }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [review]
      operationId: listReviews
      parameters:
        - { name: employee_id, in: query, schema: { type: string } }
        - { name: cycle_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReviewSummary" } }
  /v1/reviews/{review_id}:
    get:
      tags: [review]
      operationId: getReview
      parameters: [{ name: review_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reviews/{review_id}/anchor:
    post:
      tags: [review]
      operationId: anchorReview
      description: "HR anchors the review hash on chain (registry anchorBatch, count 1, batch ids >= 1e9) so the reasoning shown in the bonus review is provably the one produced from the committed data. Requires a World ID step-up (action pw-anchor-review, signal = review_hash): a real, unique human signs off."
      parameters: [{ name: review_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                world_result: { $ref: "#/components/schemas/WorldResult" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/reviews/{review_id}/acknowledge:
    post:
      tags: [review]
      operationId: acknowledgeReview
      description: "The employee confirms with World ID (action pw-ack-review, signal = review_hash) that they received exactly this review. Only the reviewed employee; once; replayed proofs are rejected."
      parameters: [{ name: review_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [world_result]
              properties:
                world_result: { $ref: "#/components/schemas/WorldResult" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/scorecards/{scorecard_id}/zk-commit:
    post:
      tags: [zk]
      operationId: zkCommitScorecard
      description: "HR or the manager commits the scorecard's score for zero-knowledge proofs: commitment = Poseidon(score_bps, salt, binding), binding = keccak(scorecard_id) >> 8, anchored on Arc (anchorBatch, batch ids >= 2e9). Idempotent per scorecard. The employee can then prove 'score >= threshold' without revealing the score."
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ZkCommitment" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [zk]
      operationId: getZkCommitment
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ZkCommitment" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/scorecards/{scorecard_id}/zk-witness:
    get:
      tags: [zk]
      operationId: getZkWitness
      description: "Only the scorecard's employee: the private witness (score + salt) needed to generate the proof in their browser. Never shown to anyone else."
      parameters: [{ $ref: "#/components/parameters/ScorecardId" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ZkWitness" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agent-pass/checkpoints:
    post:
      tags: [agent-pass]
      operationId: createAgentCheckpoint
      description: "World ID Agent Pass human checkpoint (auth.world.org, OIDC Device Authorization Grant). Pauses an agent workflow until the authorizing human approves it with fresh World ID authentication (max_age=0, Orb class). The operation is saved verbatim and bound to the attempt; the approval is usable once, for exactly that operation, within 10 minutes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation]
              properties:
                operation: { $ref: "#/components/schemas/AgentOperation" }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCheckpoint" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agent-pass/checkpoints/{checkpoint_id}:
    get:
      tags: [agent-pass]
      operationId: getAgentCheckpoint
      description: "Polls World IdP (server side, respecting its interval) and validates the ID token: signature (JWKS), iss, aud, exp, acr, auth_time newer than the attempt, and the (iss, sub) linked to this persona (enrolled on first approval). Returns the current status."
      parameters: [{ name: checkpoint_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCheckpoint" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agent-pass/checkpoints/{checkpoint_id}/cancel:
    post:
      tags: [agent-pass]
      operationId: cancelAgentCheckpoint
      parameters: [{ name: checkpoint_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCheckpoint" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/zk/proofs:
    post:
      tags: [zk]
      operationId: recordZkProof
      security: []
      description: "Public relay: records a zero-knowledge score proof permanently on Arc (ScoreProofRegistry.record). The contract itself verifies the Groth16 proof and requires the commitment to equal the root the company anchored in that batch; invalid proofs revert. Idempotent. No login, no gas for the employee."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proof, public_signals, numeric_batch_id]
              properties:
                proof: { type: object, description: "snarkjs Groth16 proof (pi_a, pi_b, pi_c)" }
                public_signals: { type: array, minItems: 3, maxItems: 3, items: { type: string, pattern: "^[0-9]+$" } }
                numeric_batch_id: { type: integer }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ZkProofRecord" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cosignToken: { type: apiKey, in: header, name: X-Cosign-Token }
    connectorKey: { type: apiKey, in: header, name: X-Connector-Key }
  parameters:
    PlanId: { name: plan_id, in: path, required: true, schema: { type: string } }
    ClaimId: { name: claim_id, in: path, required: true, schema: { type: string } }
    EvidenceId: { name: evidence_id, in: path, required: true, schema: { type: string } }
    ScorecardId: { name: scorecard_id, in: path, required: true, schema: { type: string } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Bytes32: { type: string, pattern: "^0x[0-9a-f]{64}$" }
    Address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    Signature: { type: string, pattern: "^0x[0-9a-f]{130}$" }
    Amount: { type: string, pattern: "^[0-9]+$", description: "Decimal string of base units (USDC: 6 decimals)." }
    Timestamp: { type: string, format: date-time }
    PersonaId:
      type: string
      enum: [p_dev_a, p_dev_b, p_dev_c, p_eng_mgr, p_ae, p_sales_mgr, p_mkt_exec, p_mkt_mgr, p_hr, p_client_cfo]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unknown_field
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - invalid_state
                - approval_required
                - approval_denied
                - grant_closed
                - signature_mismatch
                - world_verification_failed
                - validation_failed
                - gate_failed
                - cluster_mismatch
                - chain_error
                - upstream_unavailable
                - rate_limited
                - internal
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Role: { type: string, enum: [employee, manager, hr, external_cosigner, admin] }
    Persona:
      type: object
      additionalProperties: false
      required: [persona_id, employee_id, display_name, role, department, wallet_address]
      properties:
        persona_id: { $ref: "#/components/schemas/PersonaId" }
        employee_id: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        department: { type: string, enum: [software, marketing, sales, product, hr, external] }
        wallet_address: { $ref: "#/components/schemas/Address" }
        ens_name: { type: [string, "null"] }
        manager_employee_id: { type: [string, "null"] }
        world_id_verified: { type: boolean }
    Employee:
      type: object
      additionalProperties: false
      required: [employee_id, display_name, department, level, plan_id, wallet_address]
      properties:
        employee_id: { type: string }
        display_name: { type: string }
        department: { type: string, enum: [software, marketing, sales, product] }
        level: { type: string, enum: [ic, senior_ic, lead, manager] }
        plan_id: { type: string }
        cluster_id: { type: [string, "null"], description: "department.level peer cluster (CR-004)" }
        wallet_address: { $ref: "#/components/schemas/Address" }
        ens_name: { type: [string, "null"] }
        manager_employee_id: { type: [string, "null"] }
    Cycle:
      type: object
      additionalProperties: false
      required: [cycle_id, numeric_id, label, starts_on, ends_on, status]
      properties:
        cycle_id: { type: string }
        numeric_id: { type: integer, minimum: 1, description: "The uint64 used in EIP-712 and contracts." }
        label: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { type: string, enum: [open, closed] }
    ProgressionKind: { type: string, enum: [target_attainment, tiered_commission, bug_credit] }
    PlanKra:
      type: object
      additionalProperties: false
      required: [kra_id, label, weight_bps, direction, target, floor_ppm, cap_ppm, metric_key, agg, basis]
      properties:
        kra_id: { type: string }
        label: { type: string }
        weight_bps: { type: integer, minimum: 0, maximum: 10000 }
        direction: { type: string, enum: [higher_better, lower_better] }
        target: { type: integer, minimum: 1 }
        floor_ppm: { type: integer, minimum: 0 }
        cap_ppm: { type: integer, minimum: 1 }
        metric_key: { type: string, description: "Key that EvidenceItem.observations[].metric_key must match to feed this KRA." }
        agg: { type: string, enum: [sum, latest], description: "How observations of metric_key are combined into the KRA actual. See spec/ENGINE.md." }
        source: { type: string, enum: [git, tickets, crm, hris, worklog, cosign, bug_credit, manual] }
        basis: { type: string, description: "Documented source of the KRA definition, e.g. dora, space, sales_ote, mkt_pipeline." }
    BugCreditPolicy:
      type: object
      additionalProperties: false
      required: [severity, taper_bps, share_defaults]
      properties:
        severity:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [weight_milli, full_credit_count, tier_cap_milli]
            properties:
              weight_milli: { type: integer }
              full_credit_count: { type: integer }
              tier_cap_milli: { type: integer }
        taper_bps: { type: integer }
        share_defaults:
          type: object
          additionalProperties: false
          required: [finder_bps, fixer_bps, reviewer_bps]
          properties:
            finder_bps: { type: integer }
            fixer_bps: { type: integer }
            reviewer_bps: { type: integer }
    CommissionPolicy:
      type: object
      additionalProperties: false
      required: [quota, rate_bps, accelerator_bps, metric_key]
      properties:
        quota: { type: integer, minimum: 1 }
        rate_bps: { type: integer }
        accelerator_bps: { type: integer }
        metric_key: { type: string }
        retention_metric_key: { type: [string, "null"] }
    GatePolicy:
      type: object
      additionalProperties: false
      required: [min_verified_ratio_bps]
      properties:
        min_verified_ratio_bps: { type: integer, minimum: 0, maximum: 10000 }
    Plan:
      type: object
      additionalProperties: false
      required: [plan_id, name, department, kind, target_bonus, holdback_bps, maturity_days, payout_curve, kras, gates, formula_hash]
      properties:
        plan_id: { type: string }
        name: { type: string }
        department: { type: string, enum: [software, marketing, sales, product] }
        kind: { $ref: "#/components/schemas/ProgressionKind" }
        target_bonus: { $ref: "#/components/schemas/Amount" }
        holdback_bps: { type: integer, minimum: 0, maximum: 10000 }
        maturity_days: { type: integer, minimum: 0 }
        payout_curve:
          type: array
          description: "[[score_bps, multiplier_bps], ...] x strictly increasing, y non-decreasing, linear interpolation, clamped at ends."
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0 } }
        kras: { type: array, items: { $ref: "#/components/schemas/PlanKra" } }
        bug_credit: { $ref: "#/components/schemas/BugCreditPolicy" }
        commission: { $ref: "#/components/schemas/CommissionPolicy" }
        gates: { $ref: "#/components/schemas/GatePolicy" }
        carry_forward: { $ref: "#/components/schemas/CarryForwardPolicy" }
        formula_hash: { $ref: "#/components/schemas/Bytes32" }
    CarryForwardPolicy:
      type: object
      additionalProperties: false
      required: [history_weight_bps]
      properties:
        history_weight_bps: { type: integer, minimum: 0, maximum: 5000, description: "Weight of the trailing prior-cycle score blended into this cycle (0-50%)." }
        open_item_decay_bps: { type: integer, minimum: 0, maximum: 10000 }
    ClaimKind: { type: string, enum: [client_call, delivery_signoff, demo, incident_support, deal_support, campaign_signoff, other] }
    ClaimBody:
      type: object
      additionalProperties: false
      required: [schema, kind, summary, occurred_on, duration_minutes, counterparty_label]
      properties:
        schema: { type: string, const: pw.claim.v1 }
        kind: { $ref: "#/components/schemas/ClaimKind" }
        summary: { type: string, minLength: 1, maxLength: 500 }
        occurred_on: { type: string, format: date }
        duration_minutes: { type: integer, minimum: 0, maximum: 1440 }
        counterparty_label: { type: string, maxLength: 120 }
    ClaimState: { type: string, enum: [drafted, submitted, pending_cosign, verified, declined, expired, disputed, rejected] }
    CosignAuthMethod: { type: string, enum: [world_id, magic_link_wallet] }
    InferenceRecord:
      type: object
      additionalProperties: false
      required: [provider, model, mode, request_id, tee_verified, created_at]
      properties:
        provider: { type: string, enum: [0g_private_computer, mock] }
        model: { type: string }
        mode: { type: string, enum: [live, mock] }
        request_id: { type: string }
        zg_res_key: { type: [string, "null"] }
        tee_verified: { type: [boolean, "null"], description: "null in mock mode." }
        prompt_hash: { $ref: "#/components/schemas/Bytes32" }
        output_hash: { $ref: "#/components/schemas/Bytes32" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ClaimCreate:
      type: object
      additionalProperties: false
      required: [cycle_id, kra_id, raw_text, cosigner_address, cosigner_label]
      properties:
        cycle_id: { type: string }
        kra_id: { type: string }
        raw_text: { type: string, minLength: 1, maxLength: 4000, description: "UNTRUSTED text. Treated as data by the AI step (prompt-injection defence)." }
        cosigner_address: { $ref: "#/components/schemas/Address" }
        cosigner_label: { type: string, maxLength: 120 }
    Claim:
      type: object
      additionalProperties: false
      required: [claim_id, employee_id, cycle_id, kra_id, state, body, evidence_excerpt, cosigner_address, cosigner_label, created_at]
      properties:
        claim_id: { type: string }
        employee_id: { type: string }
        cycle_id: { type: string }
        kra_id: { type: string }
        state: { $ref: "#/components/schemas/ClaimState" }
        body: { $ref: "#/components/schemas/ClaimBody" }
        evidence_excerpt: { type: string }
        cosigner_address: { $ref: "#/components/schemas/Address" }
        cosigner_label: { type: string }
        ai_flags: { type: array, items: { type: string, enum: [prompt_injection_suspected, low_confidence, fields_inferred] } }
        inference: { $ref: "#/components/schemas/InferenceRecord" }
        claim_commitment: { $ref: "#/components/schemas/Bytes32" }
        evidence_commitment: { $ref: "#/components/schemas/Bytes32" }
        employee_signature: { $ref: "#/components/schemas/Signature" }
        cosigner_signature: { $ref: "#/components/schemas/Signature" }
        evidence_id: { type: [string, "null"] }
        decline_reason: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TypedDataClaim:
      type: object
      additionalProperties: false
      required: [domain, types, primaryType, message]
      properties:
        domain:
          type: object
          additionalProperties: false
          required: [name, version, chainId, verifyingContract]
          properties:
            name: { type: string, const: Proofwork }
            version: { type: string, const: "1" }
            chainId: { type: integer }
            verifyingContract: { $ref: "#/components/schemas/Address" }
        types: { type: object, additionalProperties: true }
        primaryType: { type: string, const: Claim }
        message:
          type: object
          additionalProperties: false
          required: [employee, claimCommitment, evidenceCommitment, cycleId, kraId, cosigner, nonce, deadline]
          properties:
            employee: { $ref: "#/components/schemas/Address" }
            claimCommitment: { $ref: "#/components/schemas/Bytes32" }
            evidenceCommitment: { $ref: "#/components/schemas/Bytes32" }
            cycleId: { type: integer, description: "uint64 as JSON integer; use BigInt() in the client." }
            kraId: { $ref: "#/components/schemas/Bytes32" }
            cosigner: { $ref: "#/components/schemas/Address" }
            nonce: { type: integer }
            deadline: { type: integer, description: "unix seconds" }
    SigningPackage:
      type: object
      additionalProperties: false
      required: [claim_id, typed_data, digest, claim_value, claim_salt, evidence_value, evidence_salt]
      properties:
        claim_id: { type: string }
        typed_data: { $ref: "#/components/schemas/TypedDataClaim" }
        digest: { $ref: "#/components/schemas/Bytes32" }
        claim_value: { $ref: "#/components/schemas/ClaimBody" }
        claim_salt: { $ref: "#/components/schemas/Bytes32" }
        evidence_value:
          type: object
          additionalProperties: false
          required: [excerpt]
          properties:
            excerpt: { type: string }
        evidence_salt: { $ref: "#/components/schemas/Bytes32" }
    WorldResult:
      type: object
      description: |
        OPAQUE to everything except the WorldVerifier adapter in apps/api. Agent B passes through exactly what the World SDK
        returned, plus the `adapter` tag naming which flow produced it. Do not interpret or reshape.
      additionalProperties: true
      required: [adapter, payload]
      properties:
        adapter: { type: string, enum: [agent_pass, idkit, mock] }
        payload: { type: object, additionalProperties: true }
    CosignGrant:
      type: object
      additionalProperties: false
      required: [grant_id, claim_id, auth_method, expires_at, url, token]
      properties:
        grant_id: { type: string }
        claim_id: { type: string }
        auth_method: { $ref: "#/components/schemas/CosignAuthMethod" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        url: { type: string, description: "Frontend path + token fragment, e.g. /cosign#token=...; fragment is never sent to servers." }
        token: { type: string, description: "Shown once." }
    CosignView:
      type: object
      additionalProperties: false
      required: [claim_id, auth_method, requester_display_name, body, evidence_excerpt, typed_data, expires_at]
      properties:
        claim_id: { type: string }
        auth_method: { $ref: "#/components/schemas/CosignAuthMethod" }
        requester_display_name: { type: string }
        body: { $ref: "#/components/schemas/ClaimBody" }
        evidence_excerpt: { type: string }
        typed_data: { $ref: "#/components/schemas/TypedDataClaim" }
        employee_signature: { $ref: "#/components/schemas/Signature" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        world_action: { type: string, description: "Action string the World proof must bind to (only when auth_method=world_id)." }
        provenance:
          type: object
          additionalProperties: false
          required: [storage, drafted_by]
          description: "Where the claim the co-signer sees came from: the sealed copy on 0G Storage (downloaded, decrypted and compared at view time) and the 0G Private Computer draft."
          properties:
            storage:
              type: object
              additionalProperties: false
              required: [backend, root, verified, read_ms, note]
              properties:
                backend: { type: string, enum: [0g_storage, local_replica, none] }
                root: { type: [string, "null"] }
                verified: { type: boolean, description: "the copy read back from storage decrypts and matches the committed claim byte for byte" }
                read_ms: { type: [integer, "null"] }
                note: { type: string }
            drafted_by:
              type: [object, "null"]
              additionalProperties: false
              required: [provider, model, request_id, tee_verified]
              properties:
                provider: { type: string }
                model: { type: string }
                request_id: { type: string }
                tee_verified: { type: [boolean, "null"] }
        ai_flags: { type: array, items: { type: string, enum: [prompt_injection_suspected, low_confidence, fields_inferred] }, description: "Same flags as Claim.ai_flags so the co-signer sees them (CR-001, spec 1.1.0)." }
    EvidenceStatus: { type: string, enum: [unverified, verified, provisional, vested, disputed, reverted, superseded, rejected, shredded] }
    EvidenceSource: { type: string, enum: [github, tickets, crm, hris, worklog, cosign, manual, dev] }
    Observation:
      type: object
      additionalProperties: false
      required: [metric_key, value]
      properties:
        metric_key: { type: string }
        value: { type: integer, description: "Integer in the metric's natural unit (count, minutes, bps, currency minor units)." }
    EvidenceItem:
      type: object
      additionalProperties: false
      required: [evidence_id, employee_id, cycle_id, source, kind, status, observed_at, commitment, observations, seq, prev_hash, event_hash]
      properties:
        evidence_id: { type: string }
        employee_id: { type: string }
        cycle_id: { type: string }
        source: { $ref: "#/components/schemas/EvidenceSource" }
        kind: { type: string, description: "e.g. pr_merged, pr_reverted, bug_fixed, ticket_closed, deal_closed, campaign_milestone, client_cosign, review_done." }
        ref: { type: [string, "null"], description: "External reference like gh:acme/core#101." }
        status: { $ref: "#/components/schemas/EvidenceStatus" }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        observations: { type: array, items: { $ref: "#/components/schemas/Observation" } }
        severity: { type: [string, "null"], enum: [P0, P1, P2, P3, null] }
        self_introduced: { type: boolean }
        share_bps: { type: integer, minimum: 0, maximum: 10000 }
        links:
          type: object
          additionalProperties: false
          properties:
            reverts_evidence_id: { type: [string, "null"] }
            supersedes_evidence_id: { type: [string, "null"] }
            claim_id: { type: [string, "null"] }
        commitment: { $ref: "#/components/schemas/Bytes32" }
        batch_id: { type: [string, "null"] }
        merkle_proof: { type: [array, "null"], items: { $ref: "#/components/schemas/Bytes32" } }
        seq: { type: integer, minimum: 1 }
        prev_hash: { $ref: "#/components/schemas/Bytes32" }
        event_hash: { $ref: "#/components/schemas/Bytes32" }
        replica: { type: object, additionalProperties: false, properties: { zg_root: { type: [string, "null"] }, status: { type: string, enum: [none, pending, stored, failed, shredded] } } }
    EvidenceIngest:
      type: object
      additionalProperties: false
      required: [employee_id, cycle_id, source, kind, observed_at, observations]
      properties:
        employee_id: { type: string }
        cycle_id: { type: string }
        source: { $ref: "#/components/schemas/EvidenceSource" }
        kind: { type: string }
        ref: { type: [string, "null"] }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        observations: { type: array, items: { $ref: "#/components/schemas/Observation" } }
        severity: { type: [string, "null"], enum: [P0, P1, P2, P3, null] }
        self_introduced: { type: boolean }
        share_bps: { type: integer, minimum: 0, maximum: 10000 }
        reverts_ref: { type: [string, "null"], description: "ref of the evidence item being reverted." }
        raw: { type: object, additionalProperties: true, description: "Untrusted raw payload. Stored encrypted; never fed to the scoring engine." }
    Run:
      type: object
      additionalProperties: false
      required: [run_id, employee_id, cycle_id, status, tool_calls, evidence_ids, started_at]
      properties:
        run_id: { type: string }
        employee_id: { type: string }
        cycle_id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tool, ok]
            properties:
              tool: { type: string, enum: [git, tickets, crm, hris, worklog] }
              ok: { type: boolean }
              items_found: { type: integer }
              note: { type: string }
        evidence_ids: { type: array, items: { type: string } }
        inference: { $ref: "#/components/schemas/InferenceRecord" }
        agent_identity: { type: object, additionalProperties: false, properties: { ens_name: { type: string }, address: { $ref: "#/components/schemas/Address" }, agent_pass: { type: string, enum: [verified, mock, unverified] } } }
        error: { type: [string, "null"] }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { type: [string, "null"] }
    ComputeRequest:
      type: object
      additionalProperties: false
      required: [plan_id, employee_id, cycle_id]
      properties:
        plan_id: { type: string }
        employee_id: { type: string }
        cycle_id: { type: string }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        override_actuals:
          type: object
          description: "Sandbox what-if: kra_id -> integer actual. When present, evidence is ignored for those KRAs."
          additionalProperties: { type: integer }
    ScoreLine:
      type: object
      additionalProperties: false
      required: [kra_id, actual, target, attainment_ppm, capped_ppm, weight_bps, contribution_ppm]
      properties:
        kra_id: { type: string }
        actual: { type: integer }
        target: { type: integer }
        attainment_ppm: { type: integer }
        capped_ppm: { type: integer }
        weight_bps: { type: integer }
        contribution_ppm: { type: integer }
        evidence_ids: { type: array, items: { type: string } }
    ComputeResult:
      type: object
      additionalProperties: false
      required: [plan_id, formula_hash, lines, score_ppm, score_bps, verified_ratio_bps, gate_passed, multiplier_bps, bonus_amount, inputs_hash]
      properties:
        plan_id: { type: string }
        formula_hash: { $ref: "#/components/schemas/Bytes32" }
        lines: { type: array, items: { $ref: "#/components/schemas/ScoreLine" } }
        score_ppm: { type: integer }
        score_bps: { type: integer }
        carry_forward:
          type: object
          additionalProperties: false
          properties:
            prior_score_bps: { type: [integer, "null"] }
            history_weight_bps: { type: integer }
            blended_score_bps: { type: integer }
            open_items: { type: array, items: { type: string } }
        bug_credit:
          type: object
          additionalProperties: false
          properties:
            tiers_milli: { type: object, additionalProperties: { type: integer } }
            total_milli: { type: integer }
        commission:
          type: object
          additionalProperties: false
          description: "Only for plans of kind tiered_commission. Whole-currency units (USD); bonus_amount = payout x 1000000."
          properties:
            attainment_bps: { type: integer }
            base: { type: integer }
            accelerated: { type: integer }
            payout: { type: integer }
        verified_ratio_bps: { type: integer }
        gate_passed: { type: boolean }
        multiplier_bps: { type: integer }
        bonus_amount: { $ref: "#/components/schemas/Amount" }
        inputs_hash: { $ref: "#/components/schemas/Bytes32" }
        warnings: { type: array, items: { type: string } }
    ScorecardStatus: { type: string, enum: [draft, pending_approval, approved, denied, attested, superseded, revoked] }
    Scorecard:
      type: object
      additionalProperties: false
      required: [scorecard_id, employee_id, cycle_id, version, status, result, evidence_ids, created_at]
      properties:
        scorecard_id: { type: string }
        employee_id: { type: string }
        cycle_id: { type: string }
        version: { type: integer, minimum: 1 }
        supersedes_scorecard_id: { type: [string, "null"] }
        revision_reason: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ScorecardStatus" }
        result: { $ref: "#/components/schemas/ComputeResult" }
        evidence_ids: { type: array, items: { type: string } }
        evidence_root: { $ref: "#/components/schemas/Bytes32" }
        score_commitment: { $ref: "#/components/schemas/Bytes32" }
        subject_id: { $ref: "#/components/schemas/Bytes32" }
        approval_id: { type: [string, "null"] }
        needs_revision: { type: boolean, description: "True when evidence used by this scorecard was reverted/superseded after it was computed. A human then calls /revise." }
        attestation: { oneOf: [{ $ref: "#/components/schemas/AttestationRef" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ScorecardDiff:
      type: object
      additionalProperties: false
      required: [from_id, to_id, score_bps_delta, multiplier_bps_delta, line_changes, evidence_added, evidence_removed]
      properties:
        from_id: { type: string }
        to_id: { type: string }
        score_bps_delta: { type: integer }
        multiplier_bps_delta: { type: integer }
        bonus_amount_delta: { type: string, pattern: "^-?[0-9]+$" }
        line_changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kra_id, actual_from, actual_to, contribution_ppm_delta]
            properties:
              kra_id: { type: string }
              actual_from: { type: integer }
              actual_to: { type: integer }
              contribution_ppm_delta: { type: integer }
        evidence_added: { type: array, items: { type: string } }
        evidence_removed: { type: array, items: { type: string } }
    ApprovalStatus: { type: string, enum: [pending, approved, denied, cancelled, expired] }
    Approval:
      type: object
      additionalProperties: false
      required: [approval_id, scorecard_id, status, challenge, created_at]
      properties:
        approval_id: { type: string }
        scorecard_id: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        challenge: { $ref: "#/components/schemas/Bytes32" }
        world_action: { type: string, description: "The action string the World step-up must be bound to." }
        approver_employee_id: { type: [string, "null"] }
        comment: { type: [string, "null"] }
        approval_proof_hash: { oneOf: [{ $ref: "#/components/schemas/Bytes32" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        decided_at: { type: [string, "null"] }
    AnchorBatch:
      type: object
      additionalProperties: false
      required: [batch_id, numeric_id, root, count, tx_hash, chain_mode, anchored_at]
      properties:
        batch_id: { type: string }
        numeric_id: { type: integer, minimum: 1 }
        root: { $ref: "#/components/schemas/Bytes32" }
        count: { type: integer }
        evidence_ids: { type: array, items: { type: string } }
        tx_hash: { $ref: "#/components/schemas/Bytes32" }
        chain_mode: { type: string, enum: [mock, live] }
        explorer_url: { type: [string, "null"] }
        anchored_at: { $ref: "#/components/schemas/Timestamp" }
    AttestationRef:
      type: object
      additionalProperties: false
      required: [attestation_id, scorecard_id, version, tx_hash, chain_mode, attested_at]
      properties:
        attestation_id: { type: integer, minimum: 1 }
        scorecard_id: { type: string }
        version: { type: integer }
        supersedes_attestation_id: { type: [integer, "null"] }
        tx_hash: { $ref: "#/components/schemas/Bytes32" }
        chain_mode: { type: string, enum: [mock, live] }
        explorer_url: { type: [string, "null"] }
        attested_at: { $ref: "#/components/schemas/Timestamp" }
    PayoutStatus: { type: string, enum: [none, registered, active, disputed, closed] }
    Payout:
      type: object
      additionalProperties: false
      required: [scorecard_id, status, payee, target_bonus, entitlement, paid, held, forfeited, overpaid]
      properties:
        scorecard_id: { type: string }
        status: { $ref: "#/components/schemas/PayoutStatus" }
        payee: { $ref: "#/components/schemas/Address" }
        target_bonus: { $ref: "#/components/schemas/Amount" }
        entitlement: { $ref: "#/components/schemas/Amount" }
        paid: { $ref: "#/components/schemas/Amount" }
        held: { $ref: "#/components/schemas/Amount" }
        forfeited: { $ref: "#/components/schemas/Amount" }
        overpaid: { $ref: "#/components/schemas/Amount" }
        maturity_at: { type: [string, "null"] }
        last_tx_hash: { oneOf: [{ $ref: "#/components/schemas/Bytes32" }, { type: "null" }] }
        explorer_url: { type: [string, "null"] }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [evidence, scorecard, claim] }
        id: { type: string }
        reveal:
          type: object
          additionalProperties: false
          description: What the verifier was shown. For claims, claim and evidence reveals are both accepted.
          properties:
            value: { type: object, additionalProperties: true }
            salt: { $ref: "#/components/schemas/Bytes32" }
            evidence_value: { type: object, additionalProperties: true }
            evidence_salt: { $ref: "#/components/schemas/Bytes32" }
    VerifyResult:
      type: object
      additionalProperties: false
      required: [ok, kind, id, checks]
      properties:
        ok: { type: boolean }
        kind: { type: string }
        id: { type: string }
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, ok]
            properties:
              name:
                type: string
                enum: [commitment_matches, merkle_proof_valid, root_anchored_on_chain, attestation_not_revoked, employee_signature_valid, cosigner_signature_valid, hash_chain_intact, formula_hash_matches, evidence_not_shredded]
              ok: { type: boolean }
              detail: { type: string }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [seq, at, actor, action, subject, prev_hash, event_hash]
      properties:
        seq: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string, description: "persona_id | system | agent | connector:<name> | cosigner:<claim_id>" }
        action: { type: string }
        subject: { type: string }
        detail: { type: object, additionalProperties: true }
        prev_hash: { $ref: "#/components/schemas/Bytes32" }
        event_hash: { $ref: "#/components/schemas/Bytes32" }
    PublicConfig:
      type: object
      additionalProperties: false
      required: [spec_version, org_name, auth_mode, chain_mode, chain, contracts, eip712_domain, world_mode, zerog_mode, agent]
      properties:
        spec_version: { type: string }
        org_name: { type: string }
        auth_mode: { type: string, enum: [dev, sso] }
        chain_mode: { type: string, enum: [mock, live] }
        chain:
          type: object
          additionalProperties: false
          required: [chain_id, name]
          properties:
            chain_id: { type: integer }
            name: { type: string }
            rpc_url: { type: [string, "null"] }
            explorer_base_url: { type: [string, "null"] }
            amount_divisor: { type: integer, minimum: 1, description: "On-chain amounts are the API amounts divided by this (testnet funding; CR-003, spec 1.2.0). 1 or absent = unscaled." }
        contracts:
          type: object
          additionalProperties: false
          required: [registry, vault, asset]
          properties:
            registry: { $ref: "#/components/schemas/Address" }
            vault: { $ref: "#/components/schemas/Address" }
            asset: { $ref: "#/components/schemas/Address" }
        eip712_domain:
          type: object
          additionalProperties: false
          required: [name, version, chainId, verifyingContract]
          properties:
            name: { type: string, const: Proofwork }
            version: { type: string, const: "1" }
            chainId: { type: integer }
            verifyingContract: { $ref: "#/components/schemas/Address" }
        world_mode: { type: string, enum: [mock, live] }
        world_app_id: { type: [string, "null"] }
        zerog_mode: { type: string, enum: [mock, live] }
        ens:
          type: object
          additionalProperties: false
          properties:
            network: { type: string, enum: [sepolia, mainnet, none] }
            parent_name: { type: [string, "null"] }
        agent_pass_mode: { type: string, enum: ["off", live], description: "live = the review agent needs a World ID Agent Pass human checkpoint before it reads the vault." }
        agent:
          type: object
          additionalProperties: false
          required: [ens_name, address]
          properties:
            ens_name: { type: string }
            address: { $ref: "#/components/schemas/Address" }
    Cluster:
      type: object
      additionalProperties: false
      required: [cluster_id, label, department, level, plan_id, member_count]
      properties:
        cluster_id: { type: string, description: "department.level, e.g. software.ic" }
        label: { type: string }
        department: { type: string }
        level: { type: string }
        plan_id: { type: string }
        plan_name: { type: string }
        member_count: { type: integer, minimum: 0 }
        description: { type: string }
    DistStats:
      type: object
      additionalProperties: false
      required: [n, mean, median, p25, p75, min, max, stdev]
      description: "Integer statistics over the cluster (same unit as the measured value)."
      properties:
        n: { type: integer }
        mean: { type: integer }
        median: { type: integer }
        p25: { type: integer }
        p75: { type: integer }
        min: { type: integer }
        max: { type: integer }
        stdev: { type: integer }
    ClusterMemberRow:
      type: object
      additionalProperties: false
      required: [employee_id, display_name, is_self, score_bps, multiplier_bps, bonus_amount, gate_passed, rank, percentile_bps, z_milli, kras, evidence_count]
      properties:
        employee_id: { type: [string, "null"], description: "null when anonymised for an employee viewer" }
        display_name: { type: string }
        is_self: { type: boolean }
        score_bps: { type: integer }
        multiplier_bps: { type: integer }
        bonus_amount: { $ref: "#/components/schemas/Amount" }
        gate_passed: { type: boolean }
        rank: { type: integer, minimum: 1 }
        percentile_bps: { type: integer, minimum: 0, maximum: 10000 }
        z_milli: { type: integer, description: "z-score x 1000 within the cluster" }
        kras:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kra_id, actual, attainment_ppm, percentile_bps]
            properties:
              kra_id: { type: string }
              actual: { type: integer }
              attainment_ppm: { type: integer }
              percentile_bps: { type: integer }
        evidence_count: { type: integer }
    ClusterBoard:
      type: object
      additionalProperties: false
      required: [cluster, cycle_id, plan_id, formula_hash, score_stats, kra_stats, rows, board_hash, generated_at]
      properties:
        cluster: { $ref: "#/components/schemas/Cluster" }
        cycle_id: { type: string }
        plan_id: { type: string }
        formula_hash: { $ref: "#/components/schemas/Bytes32" }
        score_stats: { $ref: "#/components/schemas/DistStats" }
        kra_stats:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kra_id, label, target, direction, actual, attainment_ppm]
            properties:
              kra_id: { type: string }
              label: { type: string }
              target: { type: integer }
              direction: { type: string }
              actual: { $ref: "#/components/schemas/DistStats" }
              attainment_ppm: { $ref: "#/components/schemas/DistStats" }
        rows: { type: array, items: { $ref: "#/components/schemas/ClusterMemberRow" } }
        board_hash: { $ref: "#/components/schemas/Bytes32" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
    HistoryPeriod:
      type: object
      additionalProperties: false
      required: [period_id, period_label, score_bps, targets_hit, targets_total, deadlines_on_time, deadlines_total, avg_slip_days_x10, evidence_id]
      properties:
        period_id: { type: string }
        period_label: { type: string }
        score_bps: { type: integer }
        targets_hit: { type: integer }
        targets_total: { type: integer }
        deadlines_on_time: { type: integer }
        deadlines_total: { type: integer }
        avg_slip_days_x10: { type: integer }
        rating: { type: [string, "null"] }
        evidence_id: { type: string }
    ContextSignal:
      type: object
      additionalProperties: false
      required: [code, tone, text]
      properties:
        code: { type: string, enum: [consistent_high_performer, improving, declining, volatile, deadline_reliable, deadline_risk, over_target, under_target, above_cluster, below_cluster, limited_history] }
        tone: { type: string, enum: [positive, neutral, negative] }
        text: { type: string }
    ContextReport:
      type: object
      additionalProperties: false
      required: [employee_id, cycle_id, cluster_id, history, current, trend_bps_per_period, mean_bps, volatility_bps, target_hit_rate_bps, on_time_rate_bps, cluster_position, signals, context_hash]
      properties:
        employee_id: { type: string }
        cycle_id: { type: string }
        cluster_id: { type: string }
        history: { type: array, items: { $ref: "#/components/schemas/HistoryPeriod" } }
        current:
          type: object
          additionalProperties: false
          required: [score_bps, deadlines_on_time, deadlines_total, avg_slip_days_x10, targets_hit, targets_total]
          properties:
            score_bps: { type: integer }
            deadlines_on_time: { type: integer }
            deadlines_total: { type: integer }
            avg_slip_days_x10: { type: integer }
            targets_hit: { type: integer }
            targets_total: { type: integer }
        trend_bps_per_period: { type: integer, description: "least-squares slope over history + current" }
        mean_bps: { type: integer }
        volatility_bps: { type: integer }
        target_hit_rate_bps: { type: integer }
        on_time_rate_bps: { type: integer }
        cluster_position:
          type: object
          additionalProperties: false
          required: [rank, n, percentile_bps, z_milli, median_bps]
          properties:
            rank: { type: integer }
            n: { type: integer }
            percentile_bps: { type: integer }
            z_milli: { type: integer }
            median_bps: { type: integer }
        signals: { type: array, items: { $ref: "#/components/schemas/ContextSignal" } }
        context_hash: { $ref: "#/components/schemas/Bytes32" }
    VaultReport:
      type: object
      additionalProperties: false
      required: [items_total, from_0g, from_org_db, commitments_matched, commitments_failed, store_mode, items]
      properties:
        items_total: { type: integer }
        from_0g: { type: integer }
        from_org_db: { type: integer }
        commitments_matched: { type: integer }
        commitments_failed: { type: integer }
        store_mode: { type: string, enum: [live, mock] }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [evidence_id, employee_id, source, kind, read_from, commitment_ok]
            properties:
              evidence_id: { type: string }
              employee_id: { type: string }
              source: { type: string }
              kind: { type: string }
              read_from: { type: string, enum: [0g_storage, local_replica, org_db, shredded] }
              replica_root: { type: [string, "null"] }
              commitment_ok: { type: [boolean, "null"], description: "null = commitment not recomputable here (claims commit to the excerpt; shredded items have no key)" }
    ReasoningCitation:
      type: object
      additionalProperties: false
      required: [statement, refs]
      properties:
        statement: { type: string }
        refs: { type: array, items: { type: string }, description: "evidence ids or packet paths (e.g. layer1.deliverables)" }
    Reasoning:
      type: object
      additionalProperties: false
      required: [headline, summary, strengths, concerns, recommendation, talking_points, citations]
      properties:
        headline: { type: string }
        summary: { type: string }
        strengths: { type: array, items: { type: string } }
        concerns: { type: array, items: { type: string } }
        peer_comparison: { type: [string, "null"] }
        recommendation:
          type: object
          additionalProperties: false
          required: [bonus_position, promotion_readiness, rationale]
          properties:
            bonus_position: { type: string, enum: [above_cluster, at_cluster, below_cluster] }
            promotion_readiness: { type: string, enum: [ready, on_track, not_yet] }
            rationale: { type: string }
        talking_points: { type: array, items: { type: string } }
        citations: { type: array, items: { $ref: "#/components/schemas/ReasoningCitation" } }
    NumberCheck:
      type: object
      additionalProperties: false
      required: [passed, numbers_checked, unsupported, attempts]
      properties:
        passed: { type: boolean }
        numbers_checked: { type: integer }
        unsupported: { type: array, items: { type: string } }
        attempts: { type: integer }
    PeerComparison:
      type: object
      additionalProperties: false
      required: [peer_employee_id, peer_display_name, score_bps_self, score_bps_peer, kras]
      properties:
        peer_employee_id: { type: string }
        peer_display_name: { type: string }
        score_bps_self: { type: integer }
        score_bps_peer: { type: integer }
        kras:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kra_id, label, self, peer, ratio_milli, cluster_median]
            properties:
              kra_id: { type: string }
              label: { type: string }
              self: { type: integer }
              peer: { type: integer }
              ratio_milli: { type: [integer, "null"], description: "self/peer x 1000 (null when peer is 0)" }
              cluster_median: { type: integer }
    ReviewSummary:
      type: object
      additionalProperties: false
      required: [review_id, employee_id, cycle_id, cluster_id, headline, score_bps, reasoning_source, review_hash, created_at]
      properties:
        review_id: { type: string }
        employee_id: { type: string }
        display_name: { type: string }
        cycle_id: { type: string }
        cluster_id: { type: string }
        peer_employee_id: { type: [string, "null"] }
        headline: { type: string }
        score_bps: { type: integer }
        reasoning_source: { type: string, enum: [0g_private_computer, deterministic_fallback, mock] }
        review_hash: { $ref: "#/components/schemas/Bytes32" }
        anchor_tx_hash: { type: [string, "null"] }
        acknowledged: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Review:
      type: object
      additionalProperties: false
      required: [review_id, employee_id, display_name, cycle_id, cluster, layer1, context, peer, vault, reasoning, reasoning_source, inference, number_check, hashes, anchor, created_by, created_at]
      properties:
        review_id: { type: string }
        employee_id: { type: string }
        display_name: { type: string }
        cycle_id: { type: string }
        cluster: { $ref: "#/components/schemas/Cluster" }
        layer1:
          type: object
          additionalProperties: false
          required: [result, rank, n, percentile_bps, z_milli, score_stats]
          properties:
            result: { $ref: "#/components/schemas/ComputeResult" }
            rank: { type: integer }
            n: { type: integer }
            percentile_bps: { type: integer }
            z_milli: { type: integer }
            score_stats: { $ref: "#/components/schemas/DistStats" }
        context: { $ref: "#/components/schemas/ContextReport" }
        peer: { oneOf: [{ $ref: "#/components/schemas/PeerComparison" }, { type: "null" }] }
        vault: { $ref: "#/components/schemas/VaultReport" }
        reasoning: { $ref: "#/components/schemas/Reasoning" }
        reasoning_source: { type: string, enum: [0g_private_computer, deterministic_fallback, mock] }
        inference: { oneOf: [{ $ref: "#/components/schemas/InferenceRecord" }, { type: "null" }] }
        inference_provider: { type: [string, "null"], description: "0G provider address from x_0g_trace (live)" }
        fallback_reason: { type: [string, "null"] }
        number_check: { $ref: "#/components/schemas/NumberCheck" }
        hashes:
          type: object
          additionalProperties: false
          required: [packet_hash, context_hash, inputs_hash, output_hash, review_hash]
          properties:
            packet_hash: { $ref: "#/components/schemas/Bytes32" }
            context_hash: { $ref: "#/components/schemas/Bytes32" }
            inputs_hash: { $ref: "#/components/schemas/Bytes32" }
            output_hash: { $ref: "#/components/schemas/Bytes32" }
            review_hash: { $ref: "#/components/schemas/Bytes32" }
        agent_pass:
          type: [object, "null"]
          additionalProperties: false
          required: [checkpoint_id, operation_hash, acr, auth_time, sub_hash]
          description: "World ID Agent Pass approval the review agent ran under (null when Agent Pass is off)."
          properties:
            checkpoint_id: { type: string }
            operation_hash: { $ref: "#/components/schemas/Bytes32" }
            acr: { type: [string, "null"] }
            auth_time: { $ref: "#/components/schemas/Timestamp" }
            sub_hash: { $ref: "#/components/schemas/Bytes32" }
        anchor:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [numeric_batch_id, tx_hash, chain_mode, anchored_at]
              properties:
                numeric_batch_id: { type: integer }
                tx_hash: { type: string }
                chain_mode: { type: string, enum: [live, mock] }
                explorer_url: { type: [string, "null"] }
                anchored_at: { $ref: "#/components/schemas/Timestamp" }
                anchored_by: { type: string }
                world_result_hash: { type: [string, "null"] }
        acknowledgement:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [acknowledged_by, acknowledged_at, world_result_hash, world_mode]
              properties:
                acknowledged_by: { type: string }
                acknowledged_at: { $ref: "#/components/schemas/Timestamp" }
                world_result_hash: { type: string }
                world_mode: { type: string, enum: [live, mock] }
        world_actions:
          type: object
          additionalProperties: false
          required: [anchor, acknowledge, signal]
          properties:
            anchor: { type: string }
            acknowledge: { type: string }
            signal: { $ref: "#/components/schemas/Bytes32" }
        reasoning_agent:
          type: object
          additionalProperties: false
          required: [ens_name, system_prompt_hash, model]
          properties:
            ens_name: { type: [string, "null"], description: "ENS name whose `prompt` text record must equal system_prompt_hash" }
            system_prompt_hash: { $ref: "#/components/schemas/Bytes32" }
            model: { type: string }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ZkCommitment:
      type: object
      additionalProperties: false
      required: [scorecard_id, commitment, commitment_hex, binding, circuit, numeric_batch_id, tx_hash, chain_mode, explorer_url, verifier_address, registry_address, chain_id, created_at]
      properties:
        scorecard_id: { type: string }
        commitment: { type: string, description: "Poseidon commitment, decimal field element" }
        commitment_hex: { $ref: "#/components/schemas/Bytes32" }
        binding: { type: string, description: "decimal field element = keccak256(utf8(scorecard_id)) >> 8" }
        circuit: { type: string, description: "score_threshold (Groth16, BN254)" }
        numeric_batch_id: { type: integer }
        tx_hash: { type: string }
        chain_mode: { type: string, enum: [live, mock] }
        explorer_url: { type: [string, "null"] }
        verifier_address: { type: [string, "null"], description: "ScoreThresholdVerifier on Arc (verifyProof)" }
        registry_address: { type: string }
        chain_id: { type: integer }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ZkWitness:
      type: object
      additionalProperties: false
      required: [scorecard_id, score_bps, salt, commitment, binding, numeric_batch_id, verifier_address, registry_address, chain_id]
      properties:
        scorecard_id: { type: string }
        score_bps: { type: integer }
        salt: { type: string }
        commitment: { type: string }
        binding: { type: string }
        numeric_batch_id: { type: integer }
        verifier_address: { type: [string, "null"] }
        registry_address: { type: string }
        chain_id: { type: integer }
    AgentOperation:
      type: object
      additionalProperties: false
      required: [kind, employee_id, cycle_id]
      properties:
        kind: { type: string, enum: [review.generate] }
        employee_id: { type: string }
        cycle_id: { type: string }
        peer_employee_id: { type: [string, "null"] }
    AgentCheckpoint:
      type: object
      additionalProperties: false
      required: [checkpoint_id, operation, operation_hash, agent, status, user_code, verification_uri, verification_uri_complete, expires_at, interval_s, requested_by, world, reason, created_at, decided_at]
      properties:
        checkpoint_id: { type: string }
        operation: { $ref: "#/components/schemas/AgentOperation" }
        operation_hash: { $ref: "#/components/schemas/Bytes32" }
        agent: { type: string, description: "ENS name of the agent waiting on the human" }
        status: { type: string, enum: [pending, approved, denied, expired, cancelled, used] }
        user_code: { type: [string, "null"] }
        verification_uri: { type: [string, "null"] }
        verification_uri_complete: { type: [string, "null"] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        interval_s: { type: integer }
        requested_by: { type: string }
        world:
          type: [object, "null"]
          additionalProperties: false
          required: [iss, sub_hash, acr, amr, auth_time, enrolled]
          properties:
            iss: { type: string }
            sub_hash: { $ref: "#/components/schemas/Bytes32" }
            acr: { type: [string, "null"] }
            amr: { type: array, items: { type: string } }
            auth_time: { $ref: "#/components/schemas/Timestamp" }
            enrolled: { type: boolean, description: "true when this approval linked the World ID to the persona for the first time" }
        reason: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        decided_at: { type: [string, "null"] }
    ZkProofRecord:
      type: object
      additionalProperties: false
      required: [key, contract, chain_id, tx_hash, explorer_url, already_recorded, threshold_bps, commitment_hex]
      properties:
        key: { $ref: "#/components/schemas/Bytes32" }
        contract: { type: string }
        chain_id: { type: integer }
        tx_hash: { type: [string, "null"] }
        explorer_url: { type: [string, "null"] }
        already_recorded: { type: boolean }
        threshold_bps: { type: integer }
        commitment_hex: { $ref: "#/components/schemas/Bytes32" }
